# Use loomstory-fe/loomstory-web as the base directory when importing the parent repo.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.16.0"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "vite"
  autoLaunch = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
